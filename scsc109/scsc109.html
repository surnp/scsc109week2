<!DOCTYPE html>
<html>

<head>
    <title>My First Page!!</title>
    <style>
        body {
            font-family: sans-serif;
            background: #a5f5a2;
        }

        h1 {
            color: #246388;
        }

        p {
            color: #1e9696;
        }

        details {
            border: 1px solid #CCCCCC;
            border-radius: 8px;
            padding: 10px;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
        }

        img {
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #2ECC71;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #27AE60;
        }
    </style>
</head>

<body>
    <h1>Hello, World!</h1>
    <p>This is my first web page.</p>
    <details>
        <summary>Click to expand</summary>
        <p>hidden</p>
    </details>
    <button id="button">Click Me </button>
    <script>
        document.getElementById("button")
            .addEventListener("click", function () {
                alert("Hello, you clicked!");
            });
    </script>
    <img src="1.jpg" alt="hello" width="300">
</body>

</html>
